
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cyber Defender</title>

    <style>
        .abhedya {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 70px;
    height: 70px;
    object-fit: contain;
}


        body {
            margin: 0;
            font-family: Arial;
            background: #0b1220;
            color: white;
        }

        .game {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            color: #00e5ff;
        }

        .top {
            position: relative;
            padding-right: 100px;
            background: #172235;
            padding-top: 20px;
            padding-bottom: 20px;
            padding-left: 20px;
            border-radius: 15px;
        }

        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat {
            background: #263852;
            padding: 10px;
            border-radius: 8px;
        }

        .levels {
            display: flex;
            gap: 8px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .level {
            background: #263852;
            padding: 10px;
            border-radius: 8px;
        }

        .active {
            background: #008fa0;
        }

        .locked {
            opacity: 0.4;
        }

        .screen {
            background: #172235;
            padding: 25px;
            border-radius: 15px;
            min-height: 400px;
        }

        button {
            background: #263852;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 14px;
            margin: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #008fa0;
        }

        .safe {
            background: #17633d;
        }

        .danger {
            background: #73353d;
        }

        .primary {
            background: #007f8c;
        }

        .desktop {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .icon {
            height: 110px;
        }

        .icon span {
            display: block;
            font-size: 35px;
        }

        .message {
            background: #0b1220;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .email {
            background: #0b1220;
            padding: 15px;
            margin: 12px 0;
            border-radius: 10px;
        }

        .network {
            background: #0b1220;
            padding: 20px;
            text-align: center;
            border-radius: 10px;
        }

        .node {
            display: inline-block;
            background: #263852;
            padding: 15px;
            margin: 8px;
            border-radius: 10px;
        }

        .suspicious {
            background: #73353d;
        }

        .actions {
            margin-top: 20px;
        }
    </style>
</head>


<body>
    

<div class="game">

    <div class="top">
        <img src="abhedya.png" class="abhedya" alt="abhedya">

        <h1>🛡️ CYBER DEFENDER</h1>

        <p>
            Make the right decisions.
            Protect the system. 
            
        </p>

        <div class="stats">

            <div class="stat">
                ❤️ Lives: <span id="lives">3</span>
            </div>

            <div class="stat">
                ⭐ Score: <span id="score">0</span>
            </div>

            <div class="stat">
                ⏱️ Time: <span id="time">--</span>
            </div>

        </div>

    </div>


    <div class="levels" id="levels"></div>


    <div class="screen" id="gameScreen"></div>

</div>



<script>

/* =========================
   GAME VARIABLES
========================= */

let currentLevel = 1;
let lives = 3;
let score = 0;
let timer;
let timeLeft = 0;
let awarded = {};
let gameStarted = false;

// Each scoring action can only pay out once per game
function award(key, points) {
    if (awarded[key]) return;
    awarded[key] = true;
    score += points;
    updateGame();
}


/* =========================
   LEVEL NAMES
========================= */

let levelNames = [
    "Cyber Safety",
    "Phishing",
    "Malware",
    "Network",
    "Cyber Crisis"
];


/* =========================
   UPDATE GAME
========================= */

function updateGame() {

    document.getElementById("lives").innerText = lives;

    document.getElementById("score").innerText = score;

    if (timeLeft > 0) {
        document.getElementById("time").innerText = timeLeft;
    } else {
        document.getElementById("time").innerText = "--";
    }


    let html = "";


    for (let i = 1; i <= 5 && gameStarted; i++) {

        if (i < currentLevel) {

            html += '<div class="level">✓ Level ' + i + '</div>';

        }

        else if (i == currentLevel) {

            html += '<div class="level active">▶ Level ' +
                    i + ': ' + levelNames[i - 1] +
                    '</div>';

        }

        else {

            html += '<div class="level locked">🔒 Level ' +
                    i + '</div>';

        }

    }


    document.getElementById("levels").innerHTML = html;
}


/* =========================
   TIMER
========================= */

function startTimer(seconds) {

    clearInterval(timer);

    timeLeft = seconds;

    updateGame();


    timer = setInterval(function() {

        timeLeft--;

        updateGame();


        if (timeLeft <= 0) {

            clearInterval(timer);

            loseLife("⏰ Time is over!");

        }

    }, 1000);
}


function stopTimer() {

    clearInterval(timer);

    timeLeft = 0;

    updateGame();
}


/* =========================
   SCREEN
========================= */

function showScreen(html) {

    document.getElementById("gameScreen").innerHTML = html;

}


/* =========================
   LOSE LIFE
========================= */

function loseLife(message) {

    stopTimer();

    lives--;

    updateGame();


    if (lives <= 0) {

        showScreen(

            "<h2>💀 SYSTEM COMPROMISED</h2>" +

            "<p>You ran out of lives.</p>" +

            "<div class='message'>" +

            "Final Score: " + score +

            "<br><br>" +

            "Try again and improve your cybersecurity skills!" +

            "</div>" +

            "<br>" +

            "<button class='primary' onclick='restartGame()'>" +

            "🔄 Restart Game" +

            "</button>"

        );

    }

    else {

        showScreen(

            "<h2>⚠️ Mistake!</h2>" +

            "<p>" + message + "</p>" +

            "<div class='message'>" +

            "You lost one life." +

            "<br><br>" +

            "Think carefully and try again." +

            "</div>" +

            "<br>" +

            "<button class='primary' onclick='startLevel()'>" +

            "🔄 Try Again" +

            "</button>"

        );

    }
}


/* =====================================================
   LEVEL 1
===================================================== */

function level1() {

    showScreen(

        "<h2>🟢 Level 1 — Cyber Safety</h2>" +

        "<p>" +

        "You are using a college computer. " +
        "Investigate the desktop and find anything dangerous." +

        "</p>" +

        "<div class='desktop'>" +


        "<button class='icon' onclick='safeFile()'>" +
        "<span>📄</span>Assignment.pdf</button>" +


        "<button class='icon' onclick='safeBrowser()'>" +
        "<span>🌐</span>Browser</button>" +


        "<button class='icon' onclick='dangerousFile()'>" +
        "<span>⚠️</span>Free_Games.exe</button>" +


        "<button class='icon' onclick='safeNotes()'>" +
        "<span>📝</span>Notes</button>" +


        "<button class='icon' onclick='usbDrive()'>" +
        "<span>💾</span>Unknown USB</button>" +


        "<button class='icon' onclick='passwordFile()'>" +
        "<span>🔐</span>Passwords.txt</button>" +


        "</div>" +


        "<div id='levelMessage' class='message'>" +

        "🔎 Investigate the items on the desktop." +

        "</div>"

    );


    startTimer(45);
}


function safeFile() {

    document.getElementById("levelMessage").innerHTML =
        "📄 Assignment.pdf looks safe.";

}


function safeBrowser() {

    document.getElementById("levelMessage").innerHTML =
        "🌐 The browser looks normal.";

}


function safeNotes() {

    document.getElementById("levelMessage").innerHTML =
        "📝 These are normal study notes.";

}


function dangerousFile() {

    document.getElementById("levelMessage").innerHTML =

        "<strong>⚠️ Free_Games.exe</strong>" +

        "<p>You don't remember downloading this program.</p>" +

        "<button class='safe' onclick='deleteFile()'>" +
        "🗑️ Delete File</button>" +

        "<button class='danger' onclick='runFile()'>" +
        "▶ Run File</button>";

}


function deleteFile() {

    stopTimer();

    award('deleteFile', 100);

    showScreen(

        "<h2>✅ Threat Avoided!</h2>" +

        "<p>You correctly avoided an unknown program.</p>" +

        "<div class='message'>" +

        "💡 Never run unknown executable files." +

        "</div>" +

        "<br>" +

        "<button class='primary' onclick='nextLevel()'>" +

        "Next Level →</button>"

    );

}


function runFile() {

    loseLife(
        "You ran an unknown executable. It contained malware."
    );

}


function usbDrive() {

    document.getElementById("levelMessage").innerHTML =

        "<strong>💾 Unknown USB</strong>" +

        "<p>You don't know who owns this USB.</p>" +

        "<button class='safe' onclick='scanUSB()'>" +
        "🔍 Scan USB</button>" +

        "<button class='danger' onclick='openUSB()'>" +
        "📂 Open USB</button>";

}


function scanUSB() {

    award('scanUSB', 50);

    document.getElementById("levelMessage").innerHTML =

        "🔍 Scan complete." +

        "<p>⚠️ A suspicious program was found.</p>" +

        "<p>Good decision! You did not open it.</p>";

}


function openUSB() {

    loseLife(
        "You opened an unknown USB. It contained a malicious file."
    );

}


function passwordFile() {

    document.getElementById("levelMessage").innerHTML =

        "<strong>🔐 Passwords.txt</strong>" +

        "<p>Passwords should not be stored openly.</p>" +

        "<button class='primary' onclick='securePasswords()'>" +

        "🔒 Secure File</button>";

}


function securePasswords() {

    award('securePasswords', 50);

    document.getElementById("levelMessage").innerHTML =

        "✅ Password file secured.";

}



/* =====================================================
   LEVEL 2
===================================================== */

function level2() {

    showScreen(

        "<h2>🟢 Level 2 — Phishing Investigation</h2>" +

        "<p>One of these emails is a phishing attack.</p>" +


        "<div class='email'>" +

        "<strong>Email 1</strong>" +

        "<p>From: professor@college.edu</p>" +

        "<p>Assignment submission reminder</p>" +

        "<button onclick='safeEmail()'>Open</button>" +

        "</div>" +


        "<div class='email'>" +

        "<strong>Email 2</strong>" +

        "<p>From: security-team@college-login.com</p>" +

        "<p>🚨 URGENT! Your account will be deleted!</p>" +

        "<button onclick='phishingEmail()'>Open</button>" +

        "</div>" +


        "<div class='email'>" +

        "<strong>Email 3</strong>" +

        "<p>From: library@college.edu</p>" +

        "<p>Your library book is due</p>" +

        "<button onclick='safeEmail()'>Open</button>" +

        "</div>" +

        "<div id='emailMessage' class='message'>" +

        "🔎 Find the suspicious email." +

        "</div>"

    );


    startTimer(50);
}


function safeEmail() {

    document.getElementById("emailMessage").innerHTML =

        "📧 This email looks normal. Keep investigating.";

}


function phishingEmail() {

    stopTimer();

    showScreen(

        "<h2>🚨 Suspicious Email</h2>" +

        "<div class='email'>" +

        "<p><strong>From:</strong> " +
        "security-team@college-login.com</p>" +

        "<p><strong>Subject:</strong> " +
        "URGENT! Account will be deleted!</p>" +

        "<hr>" +

        "<p>Your account will be deleted in 30 minutes.</p>" +

        "<p>Click the link and enter your password.</p>" +

        "</div>" +

        "<p>What do you do?</p>" +

        "<button class='safe' onclick='reportPhishing()'>" +
        "🚩 Report Email</button>" +

        "<button onclick='inspectLink()'>" +
        "🔍 Inspect Link</button>" +

        "<button class='danger' onclick='clickPhishingLink()'>" +
        "🔗 Click Link</button>"

    );

}


function inspectLink() {

    award('inspectLink', 50);

    showScreen(

        "<h2>🔍 Link Inspection</h2>" +

        "<div class='message'>" +

        "Visible website:<br>" +

        "<strong>college-login.com</strong>" +

        "<p>Actual destination:</p>" +

        "<strong>college-login-security.ru/login</strong>" +

        "<p>🚩 The websites do not match!</p>" +

        "</div>" +

        "<button class='safe' onclick='reportPhishing()'>" +

        "🚩 Report Phishing</button>"

    );

}


function reportPhishing() {

    stopTimer();

    award('reportPhishing', 150);

    showScreen(

        "<h2>🎯 Phishing Blocked!</h2>" +

        "<p>Excellent! You identified the warning signs.</p>" +

        "<div class='message'>" +

        "🚩 Urgency<br>" +
        "🚩 Suspicious sender<br>" +
        "🚩 Password request<br>" +
        "🚩 Fake website" +

        "</div>" +

        "<br>" +

        "<button class='primary' onclick='nextLevel()'>" +

        "Next Level →</button>"

    );

}


function clickPhishingLink() {

    loseLife(
        "You clicked the phishing link and were taken to a fake login page."
    );

}



/* =====================================================
   LEVEL 3
===================================================== */

let scanned = false;
let isolated = false;


function level3() {

    scanned = false;
    isolated = false;


    showScreen(

        "<h2>🟡 Level 3 — Malware Outbreak</h2>" +

        "<p>" +

        "Your computer is showing strange pop-ups " +
        "and an unknown program is running." +

        "</p>" +

        "<div class='message'>" +

        "⚠️ Suspicious program: " +
        "<strong>system_update.exe</strong>" +

        "<br><br>" +

        "Decide what to do."

        + "</div>" +


        "<div class='actions'>" +

        "<button onclick='updateSystem()'>" +
        "🔄 Update System</button>" +

        "<button onclick='quarantine()'>" +
        "🗑️ Quarantine</button>" +

        "<button onclick='scanComputer()'>" +
        "🔍 Scan Computer</button>" +

        "<button onclick='isolateComputer()'>" +
        "🛑 Isolate Computer</button>" +

        "</div>" +


        "<div id='malwareMessage' class='message'>" +

        "Choose your actions in the right order."

        + "</div>"

    );


    startTimer(55);
}


function scanComputer() {

    scanned = true;

    award('scanComputer', 50);

    document.getElementById("malwareMessage").innerHTML =

        "🔍 <strong>Scan Complete</strong>" +

        "<p>Malware has been detected.</p>" +

        "<p>The computer should now be isolated.</p>";

}


function isolateComputer() {

    if (!scanned) {

        document.getElementById("malwareMessage").innerHTML =

            "⚠️ You should investigate the problem first." +

            "<p>Try scanning the computer.</p>";

        return;
    }


    isolated = true;

    award('isolateComputer', 50);

    document.getElementById("malwareMessage").innerHTML =

        "🛑 <strong>Computer Isolated</strong>" +

        "<p>The computer is no longer connected to the network.</p>" +

        "<p>Now remove the malware.</p>";

}


function quarantine() {

    if (!scanned) {

        loseLife(
            "You tried to quarantine malware before identifying it."
        );

        return;
    }


    if (!isolated) {

        loseLife(
            "You tried to remove malware while the computer was still connected."
        );

        return;
    }


    stopTimer();

    award('quarantine', 200);


    showScreen(

        "<h2>🦠 Malware Contained!</h2>" +

        "<p>You successfully handled the infection.</p>" +

        "<div class='message'>" +

        "🔍 Investigated<br>" +
        "🛑 Isolated<br>" +
        "🗑️ Removed" +

        "</div>" +

        "<br>" +

        "<button class='primary' onclick='nextLevel()'>" +

        "Next Level →</button>"

    );

}


function updateSystem() {

    document.getElementById("malwareMessage").innerHTML =

        "🔄 Updating the system is useful, " +
        "but it does not immediately solve the active infection." +

        "<p>Think about investigating the problem first.</p>";

}





let networkInspected = false;


function level4() {

    networkInspected = false;


    showScreen(

        "<h2>🟠 Level 4 — Network Investigation</h2>" +

        "<p>" +

        "Your network monitor detected unusual activity."

        + "</p>" +


        "<div class='network'>" +

        "<div class='node'>💻 Your PC</div>" +

        " ↔ " +

        "<div class='node suspicious'>❓ Unknown Device</div>" +

        " ↔ " +

        "<div class='node'>🌐 Website</div>" +

        "</div>" +


        "<div class='message'>" +

        "Something unusual is happening. " +
        "Investigate before taking action."

        + "</div>" +


        "<div class='actions'>" +

        "<button onclick='secureConnection()'>" +
        "🔐 Secure Connection</button>" +

        "<button onclick='blockDevice()'>" +
        "🚫 Block Device</button>" +

        "<button onclick='inspectTraffic()'>" +
        "🔍 Inspect Traffic</button>" +

        "<button onclick='disconnectPC()'>" +
        "🔌 Disconnect PC</button>" +

        "</div>" +


        "<div id='networkMessage' class='message'>" +

        "What is causing the unusual activity?"

        + "</div>"

    );


    startTimer(50);
}


function inspectTraffic() {

    networkInspected = true;

    award('inspectTraffic', 75);

    document.getElementById("networkMessage").innerHTML =

        "🔎 <strong>Traffic Analysis</strong>" +

        "<p>" +

        "The unknown device is positioned " +
        "between your computer and the website."

        + "</p>" +

        "<p>" +

        "It appears to be intercepting communication."

        + "</p>" +

        "<strong>⚠️ Possible Man-in-the-Middle attack.</strong>" +

        "<p>Now decide what to do.</p>";

}


function secureConnection() {

    document.getElementById("networkMessage").innerHTML =

        "🔐 Connection secured." +

        "<p>" +

        "However, the suspicious device is still connected."

        + "</p>";

}


function disconnectPC() {

    document.getElementById("networkMessage").innerHTML =

        "🔌 Your PC has been disconnected." +

        "<p>" +

        "This protects your computer temporarily, " +
        "but the suspicious device is still active."

        + "</p>";

}


function blockDevice() {

    if (!networkInspected) {

        loseLife(
            "You blocked a device without first investigating it."
        );

        return;
    }


    stopTimer();

    award('blockDevice', 250);


    showScreen(

        "<h2>🚫 Threat Blocked!</h2>" +

        "<p>" +

        "You identified and stopped the suspicious device."

        + "</p>" +

        "<div class='message'>" +

        "⚠️ Man-in-the-Middle attack detected and blocked."

        + "</div>" +

        "<br>" +

        "<button class='primary' onclick='nextLevel()'>" +

        "Next Level →</button>"

    );

}





let crisis = {
    isolate: false,
    password: false,
    block: false,
    done: false
};


function level5() {

    crisis = {
        isolate: false,
        password: false,
        block: false,
        done: false
    };


    showScreen(

        "<h2>🔴 Level 5 — CYBER CRISIS</h2>" +

        "<p>🚨 Multiple systems are under attack!</p>" +

        "<div class='message'>" +

        "📧 An employee clicked a suspicious email." +

        "<br><br>" +

        "🦠 Their computer is behaving strangely." +

        "<br><br>" +

        "🔑 Their account may be compromised." +

        "<br><br>" +

        "🌐 An unknown device has appeared on the network."

        + "</div>" +


        "<h3>You are the incident responder.</h3>" +

        "<p>Contain the attack before it spreads.</p>" +


        "<div class='actions'>" +

        "<button onclick='blockCrisisDevice()'>" +
        "🚫 Block Device</button>" +

        "<button onclick='isolateCrisisComputer()'>" +
        "🛑 Isolate Computer</button>" +

        "<button onclick='secureCredentials()'>" +
        "🔑 Secure Credentials</button>" +

        "<button class='danger' onclick='ignoreAlert()'>" +
        "😴 Ignore Alert</button>" +

        "</div>" +


        "<div id='crisisMessage' class='message'>" +

        "⚠️ Multiple threats detected. Decide what to do."

        + "</div>"

    );


    startTimer(60);
}


function isolateCrisisComputer() {

    crisis.isolate = true;

    award('isolateCrisisComputer', 75);

    document.getElementById("crisisMessage").innerHTML =

        "🛑 <strong>Computer Isolated</strong>" +

        "<p>" +

        "The infected computer has been disconnected."

        + "</p>" +

        "<p>One part of the attack is contained.</p>";

    checkCrisis();

}


function secureCredentials() {

    crisis.password = true;

    award('secureCredentials', 75);

    document.getElementById("crisisMessage").innerHTML =

        "🔑 <strong>Credentials Secured</strong>" +

        "<p>" +

        "The compromised account has been protected."

        + "</p>";

    checkCrisis();

}


function blockCrisisDevice() {

    crisis.block = true;

    award('blockCrisisDevice', 75);

    document.getElementById("crisisMessage").innerHTML =

        "🚫 <strong>Unknown Device Blocked</strong>" +

        "<p>" +

        "Suspicious network access has been stopped."

        + "</p>";

    checkCrisis();

}


function checkCrisis() {

    if (

        !crisis.done &&
        crisis.isolate &&
        crisis.password &&
        crisis.block

    ) {

        crisis.done = true;

        stopTimer();

        award('crisisBonus', 300);

        setTimeout(showVictory, 500);

    }

}


function ignoreAlert() {

    loseLife(

        "You ignored a serious security incident. " +
        "The attack continued spreading."

    );

}



function nextLevel() {

    stopTimer();

    currentLevel++;


    if (currentLevel > 5) {

        showVictory();

    }

    else {

        startLevel();

    }
}




function showStartScreen() {

    gameStarted = false;

    stopTimer();

    showScreen(

        "<div style='text-align:center; padding:30px 10px;'>" +

        "<h2 style='font-size:32px; color:#00e5ff;'>Welcome, Defender</h2>" +

        "<p>Five levels. Three lives. One system to protect.</p>" +

        "<div class='message' style='text-align:left; max-width:520px; margin:25px auto;'>" +

        "🔎 Investigate before you act<br><br>" +

        "⏱️ Every level is timed<br><br>" +

        "❤️ A wrong decision costs a life" +

        "</div>" +

        "<button class='primary' style='font-size:20px; padding:18px 40px;' " +
        "onclick='startGame()'>▶ Start Game</button>" +

        "</div>"

    );
}


function startGame() {

    gameStarted = true;

    currentLevel = 1;
    lives = 3;
    score = 0;
    awarded = {};

    startLevel();
}


function startLevel() {

    updateGame();


    if (currentLevel == 1) {

        level1();

    }

    else if (currentLevel == 2) {

        level2();

    }

    else if (currentLevel == 3) {

        level3();

    }

    else if (currentLevel == 4) {

        level4();

    }

    else if (currentLevel == 5) {

        level5();

    }

}



function showVictory() {

    stopTimer();

    currentLevel = 6;
    updateGame();


    let rank;


    if (score >= 1000) {

        rank = "🏆 Cybersecurity Expert";

    }

    else if (score >= 750) {

        rank = "🥇 Security Specialist";

    }

    else if (score >= 500) {

        rank = "🥈 Cyber Defender";

    }

    else {

        rank = "🥉 Security Trainee";

    }


    showScreen(

        "<h2>🏆 MISSION COMPLETE!</h2>" +

        "<h2>Final Score: " + score + "</h2>" +

        "<h2>" + rank + "</h2>" +

        "<div class='message'>" +

        "You completed all 5 levels!" +

        "<br><br>" +

        "You learned about:" +

        "<br><br>" +

        "🛡️ Cyber Safety" +

        "<br>" +

        "📧 Phishing" +

        "<br>" +

        "🦠 Malware" +

        "<br>" +

        "🌐 Network Attacks" +

        "<br>" +

        "🚨 Incident Response"

        + "</div>" +

        "<br>" +

        "<button class='primary' onclick='restartGame()'>" +

        "🔄 Play Again</button>"

    );

}


function restartGame() {

    stopTimer();

    gameStarted = true;

    currentLevel = 1;
    lives = 3;
    score = 0;
    awarded = {};

    startLevel();

}




updateGame();
showStartScreen();
